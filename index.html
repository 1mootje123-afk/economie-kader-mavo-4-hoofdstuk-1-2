function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function groups(){let out='';let last='';topics.forEach((t,i)=>{if(t[0]){last=t[0];out+=`<div class="chapter">${last}</div>`}out+=`<button class="concept ${selected===i?'selected':''}" data-topic="${i}">${t[1]}</button>`});return out}function shell(content){app.innerHTML=`<div class="layout"><aside class="side"><h3>Inhoud</h3>${groups()}</aside><section class="panel">${content}</section></div>`;document.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>{selected=+b.dataset.topic;mode='learn';setActive('learn');render()})}function setActive(m){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.mode===m))}function learn(){const t=topics[selected];shell(`<div class="eyebrow">${t[0]||'Begrippen'}</div><h2>${t[1]}</h2><p>${t[2]}</p><div class="example"><strong>Voorbeeld</strong><br>${t[3]}</div><div class="controls"><button class="btn" id="prev">← Vorig begrip</button><button class="btn primary" id="next">Volgend begrip →</button></div>`);document.querySelector('#prev').onclick=()=>{selected=(selected+topics.length-1)%topics.length;render()};document.querySelector('#next').onclick=()=>{selected=(selected+1)%topics.length;render()}}
function buildDeck(){let all=qs.map((q,i)=>i);if(filter!=='Alles'){const chapter=filter;const names=topics.filter(t=>t[0]===chapter).map(t=>t[1].toLowerCase());all=all.filter(i=>names.some(n=>qs[i][0].toLowerCase().includes(n)))}return all.sort(()=>Math.random()-.5)}function start(m){mode=m;score=0;current=0;answered=false;deck=buildDeck();if(m==='test')deck=deck.slice(0,Math.min(20,deck.length));setActive(m);render()}
function quiz(){if(!deck.length){shell(`<h2>Geen vragen gevonden</h2><button class="btn" id="back">Terug</button>`);document.querySelector('#back').onclick=()=>start(mode);return}if(current>=deck.length){let pct=Math.round(score/deck.length*100);let grade=(1+9*score/deck.length).toFixed(1);shell(`<div class="eyebrow">${mode==='test'?'Toets afgerond':'Oefensessie afgerond'}</div><h2>Goed gedaan!</h2><div class="score">${score} / ${deck.length}</div><p>Je had ${pct}% goed.${mode==='test'?` Je cijfer is ongeveer <strong>${grade}</strong>.`:''}</p><div class="controls"><button class="btn primary" id="again">Opnieuw oefenen</button><button class="btn" id="home">Uitleg bekijken</button></div>`);document.querySelector('#again').onclick=()=>start(mode);document.querySelector('#home').onclick=()=>{mode='learn';setActive('learn');render()};return}const q=qs[deck[current]],num=current+1;shell(`<div class="eyebrow">${mode==='test'?'Toetsmodus':'Oefenmodus'} · vraag ${num} van ${deck.length}</div><div class="progress"><span style="width:${Math.round(current/deck.length*100)}%"></span></div><div class="question">${q[0]}</div><div class="answers">${q[1].map((a,i)=>`<button class="answer" data-answer="${i}" ${answered?'disabled':''}>${String.fromCharCode(65+i)}. ${a}</button>`).join('')}</div><div id="feedback"></div><div class="controls"><button class="btn primary hidden" id="nextq">${num===deck.length?'Bekijk resultaat':'Volgende vraag →'}</button></div>`);document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>check(+b.dataset.answer));if(answered)document.querySelector('#nextq').classList.remove('hidden')}
function check(n){if(answered)return;answered=true;const q=qs[deck[current]],ok=n===q[2];if(ok)score++;document.querySelectorAll('[data-answer]').forEach((b,i)=>{if(i===q[2])b.classList.add('correct');else if(i===n)b.classList.add('wrong')});document.querySelector('#feedback').innerHTML=`<div class="feedback ${ok?'good':'bad'}"><strong>${ok?'Goed!':'Nog niet helemaal.'}</strong> ${q[3]}</div>`;document.querySelector('#nextq').classList.remove('hidden');document.querySelector('#nextq').onclick=()=>{current++;answered=false;render()}}
function render(){if(mode==='learn')return learn();if(mode==='practice'||mode==='test')return quiz();}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{if(b.dataset.mode==='learn'){mode='learn';setActive(mode);render()}else{filter='Alles';start(b.dataset.mode)}});
</script></body></html>
